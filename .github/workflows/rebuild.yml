name: rebuild

on:
  schedule:
    - cron: "17 6 2 * *"
  workflow_dispatch:

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SITE_URL: https://atlas621.tetra.cool
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: cargo build --release --manifest-path pipeline/Cargo.toml

      - name: run pipeline
        run: |
          previous_arg=""
          if curl -fsSIL "$SITE_URL/data/manifest.json" > /dev/null; then
            previous_arg="--previous $SITE_URL/data"
          else
            echo "no previous deploy reachable, cold start"
          fi
          ./pipeline/target/release/atlas621-pipeline all $previous_arg

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
