name: rebuild

on:
  schedule:
    - cron: "17 6 2 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: rebuild
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline

      - name: take the last dataset as the layout seed
        id: previous
        uses: ./.github/actions/fetch-dataset
        with:
          path: previous

      - name: make room for the intermediates
        run: |
          df -h / /mnt && free -h
          # the exports and the stage outputs come to tens of gb, which only the temp disk has
          sudo mkdir -p /mnt/atlas
          sudo chown "$(id -u):$(id -g)" /mnt/atlas
          # count holds the pair table in memory, past what a 16 gb runner has, so give it swap
          # rather than let it be killed partway through
          sudo fallocate -l 32G /mnt/atlas.swap
          sudo chmod 600 /mnt/atlas.swap
          sudo mkswap /mnt/atlas.swap
          sudo swapon /mnt/atlas.swap
          swapon --show

      - run: cargo build --release --manifest-path pipeline/Cargo.toml

      - name: run the pipeline
        run: |
          seed=()
          if [ "${{ steps.previous.outputs.found }}" = "true" ]; then
            seed=(--previous previous)
          else
            echo "no previous dataset, cold start"
          fi
          ./pipeline/target/release/atlas621 \
            --cache-dir /mnt/atlas/exports \
            --work-dir /mnt/atlas/work \
            all "${seed[@]}"

      - name: pack the dataset
        run: tar -cf dataset.tar -C static data

      - uses: actions/upload-artifact@v7
        with:
          name: dataset
          path: dataset.tar
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: dataset
    uses: ./.github/workflows/deploy.yml
    with:
      dataset-run: ${{ github.run_id }}
    secrets: inherit
