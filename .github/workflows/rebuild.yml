name: rebuild

on:
  schedule:
    - cron: "17 6 2 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: rebuild
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline

      - name: take the last dataset as the layout seed
        id: previous
        uses: ./.github/actions/fetch-dataset
        with:
          path: previous

      - run: cargo build --release --manifest-path pipeline/Cargo.toml

      - name: run the pipeline
        run: |
          seed=()
          if [ "${{ steps.previous.outputs.found }}" = "true" ]; then
            seed=(--previous previous)
          else
            echo "no previous dataset, cold start"
          fi
          # peak rss measured at 8.8 gb against the runner's 16, and the pair map capacity is
          # tuned to a pair count that grows every month, so each run reports where it landed
          /usr/bin/time -v ./pipeline/target/release/atlas621 all "${seed[@]}"

      - name: pack the dataset
        run: tar -cf dataset.tar -C static data

      - uses: actions/upload-artifact@v7
        with:
          name: dataset
          path: dataset.tar
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: dataset
    uses: ./.github/workflows/deploy.yml
    with:
      dataset-run: ${{ github.run_id }}
    secrets: inherit
