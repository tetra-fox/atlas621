[package]
name = "atlas621-pipeline"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
csv = "1.4.0"
env_logger = "0.11.11"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
geo = "0.33.1"
hex = "0.4.3"
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
leiden-rs = { version = "0.8.1", default-features = false, features = ["rayon"] }
log = "0.4.34"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
polylabel = "3.3.0"
rand = "0.10.2"
rayon = "1.12.0"
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = "3.4.2"

[profile.release]
debug = 1
