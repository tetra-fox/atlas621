[package]
name = "atlas621"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
atlas-core = { path = "../core", features = ["clap"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
csv = "1.4.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
hex = "0.4.3"
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = "3.4.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
humantime = "2.4.0"
ts-rs = "12.0.1"
directories = "6"
